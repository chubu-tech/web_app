# Netlify build config.
#
# The site (`tho-app`) is connected to this repo but had never produced a
# successful deploy — which is why bhutansalons.com answered 404 on every path
# despite DNS already pointing here.
#
# NODE_VERSION is the point of this file. Netlify's default build image Node can
# lag well behind, and two things here need a recent one: Next.js 16 requires
# Node >= 20.9, and @supabase/supabase-js warns on 20 and below and will drop it.
# Pinning 22 satisfies both and makes the build reproducible rather than
# dependent on whatever the build image defaults to this month.
#
# The Next.js runtime (@netlify/plugin-nextjs) is deliberately NOT declared here:
# Netlify installs it automatically for a detected Next site, and naming it
# explicitly fails the build when the package is absent from package.json.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# iOS requires the Associated Domains file to be served as JSON, and it must
# have no file extension — so nothing infers the type. Netlify guessed
# `text/plain`, which iOS rejects.
#
# The equivalent rule in `next.config.ts` is NOT enough and is kept only for
# `next start`: files under `public/` are served straight from Netlify's CDN and
# never reach the Next.js server, so its `headers()` never runs for them. Verify
# against the deployed domain, not a local server:
#
#     curl -sI https://bhutansalons.com/.well-known/apple-app-site-association
#
# `assetlinks.json` needs no rule — its `.json` extension is inferred correctly.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# The walkthrough films, cached forever.
#
# Two 27-34 MB MP4s and their posters and caption tracks. They are immutable in the strict
# sense the directive means: a change to either film is a re-render, and a re-render produces
# a new file that replaces this one at the same URL. That is the case `immutable` is wrong
# for — so the real justification is the second half of the pair. `max-age=31536000` on a
# file the CDN serves means a visitor who opens the guide twice downloads 34 MB once, and the
# alternative is a revalidation round-trip before a video that is already playing.
#
# If a film is ever re-cut, bust it by changing the path rather than by waiting a year:
# `/guide/video/customer-v2.mp4`, and `components/guide/guide-player.tsx` is the one place
# that builds these URLs.
#
# Here rather than in `next.config.ts` for the reason the block above spells out: files under
# `public/` are served straight from Netlify's CDN and never reach the Next.js server, so its
# `headers()` never runs for them.
[[headers]]
  for = "/guide/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# WebVTT has its own type and Netlify does not infer it from the extension. Without this the
# track element gets `text/plain`, and the browser drops it silently - the CC button simply
# never appears, which looks exactly like a video that has no captions.
[[headers]]
  for = "/guide/video/*.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"
